<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="presentation-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="application-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <linearGradient id="domain-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <linearGradient id="infra-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b"/>
      <stop offset="100%" style="stop-color:#38f9d7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">Vision 2026 Architecture</text>
  <text x="400" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Clean Architecture for XOOPS Modules</text>

  <!-- Presentation Layer -->
  <g filter="url(#shadow)">
    <rect x="50" y="90" width="700" height="80" rx="12" fill="url(#presentation-grad)"/>
    <text x="400" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">PRESENTATION LAYER</text>
    <text x="150" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)">🖥️ Controllers</text>
    <text x="300" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)">📄 Templates</text>
    <text x="450" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)">🔌 API Endpoints</text>
    <text x="600" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)">💻 CLI Commands</text>
  </g>

  <!-- Arrow down -->
  <path d="M400 175 L400 195 L390 185 M400 195 L410 185" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <!-- Application Layer -->
  <g filter="url(#shadow)">
    <rect x="100" y="200" width="600" height="100" rx="12" fill="url(#application-grad)"/>
    <text x="400" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">APPLICATION LAYER</text>

    <!-- Commands box -->
    <rect x="130" y="245" width="160" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
    <text x="210" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white">📝 Commands</text>
    <text x="210" y="285" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.8)">CreateArticle</text>

    <!-- Handlers box -->
    <rect x="320" y="245" width="160" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
    <text x="400" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white">⚙️ Handlers</text>
    <text x="400" y="285" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.8)">CreateArticleHandler</text>

    <!-- Events box -->
    <rect x="510" y="245" width="160" height="40" rx="6" fill="rgba(255,255,255,0.2)"/>
    <text x="590" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white">📣 Event Dispatcher</text>
  </g>

  <!-- Arrow down -->
  <path d="M400 305 L400 325 L390 315 M400 325 L410 315" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <!-- Domain Layer (Core) -->
  <g filter="url(#shadow)">
    <rect x="150" y="330" width="500" height="120" rx="12" fill="url(#domain-grad)"/>
    <text x="400" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">DOMAIN LAYER (CORE)</text>
    <text x="400" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">Pure PHP • No Framework Dependencies</text>

    <!-- Entity -->
    <rect x="175" y="390" width="90" height="45" rx="6" fill="rgba(255,255,255,0.25)"/>
    <text x="220" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white">📦 Entity</text>
    <text x="220" y="425" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.9)">Article</text>

    <!-- Value Objects -->
    <rect x="280" y="390" width="110" height="45" rx="6" fill="rgba(255,255,255,0.25)"/>
    <text x="335" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white">💎 Value Objects</text>
    <text x="335" y="425" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.9)">ArticleId, Title</text>

    <!-- Domain Events -->
    <rect x="405" y="390" width="100" height="45" rx="6" fill="rgba(255,255,255,0.25)"/>
    <text x="455" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white">🎯 Events</text>
    <text x="455" y="425" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.9)">Published</text>

    <!-- Repository Interface -->
    <rect x="520" y="390" width="110" height="45" rx="6" fill="rgba(255,255,255,0.25)"/>
    <text x="575" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white">📋 Repository</text>
    <text x="575" y="425" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.9)">Interface</text>
  </g>

  <!-- Arrow from Domain to Infrastructure -->
  <path d="M400 455 L400 475 L390 465 M400 475 L410 465" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <text x="430" y="467" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">implements</text>

  <!-- Infrastructure Layer -->
  <g filter="url(#shadow)">
    <rect x="100" y="480" width="600" height="90" rx="12" fill="url(#infra-grad)"/>
    <text x="400" y="510" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">INFRASTRUCTURE LAYER</text>

    <!-- Repository Impl -->
    <rect x="130" y="525" width="150" height="35" rx="6" fill="rgba(255,255,255,0.25)"/>
    <text x="205" y="545" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">🗄️ XoopsArticleRepository</text>

    <!-- Database -->
    <rect x="320" y="525" width="160" height="35" rx="6" fill="rgba(255,255,255,0.25)"/>
    <text x="400" y="545" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">💾 XoopsConnection → $xoopsDB</text>

    <!-- Event Dispatcher -->
    <rect x="520" y="525" width="150" height="35" rx="6" fill="rgba(255,255,255,0.25)"/>
    <text x="595" y="545" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="white">📡 SimpleEventDispatcher</text>
  </g>

  <!-- Dependency Rule Arrow -->
  <g>
    <path d="M770 130 L770 530" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
    <polygon points="770,540 765,530 775,530" fill="#cbd5e1"/>
    <text x="755" y="340" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" transform="rotate(-90 755 340)">Dependencies point inward →</text>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 580)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">The Dependency Rule: Outer layers depend on inner layers, never the reverse.</text>
  </g>
</svg>
